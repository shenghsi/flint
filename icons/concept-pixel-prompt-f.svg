<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="#0e0e0e"/>

  <!--
    >_ prompt — pixel font, block=12px, top-left
    > is a 4-col × 7-row diagonal; _ is 5-col × 1-row (baseline only)
    x-origin=102 (shifted +60 = one char cell right), y-origin=50
    cols: 102 114 126 138   rows: 50 62 74 86 98 110 122
  -->

  <!-- > -->
  <g fill="#e4e4e4">
    <rect x="102" y="50"  width="12" height="12"/>  <!-- r0 c0 -->
    <rect x="114" y="62"  width="12" height="12"/>  <!-- r1 c1 -->
    <rect x="126" y="74"  width="12" height="12"/>  <!-- r2 c2 -->
    <rect x="138" y="86"  width="12" height="12"/>  <!-- r3 c3 tip -->
    <rect x="126" y="98"  width="12" height="12"/>  <!-- r4 c2 -->
    <rect x="114" y="110" width="12" height="12"/>  <!-- r5 c1 -->
    <rect x="102" y="122" width="12" height="12"/>  <!-- r6 c0 -->
  </g>

  <!-- _ cursor (amber) — 1-char gap then 5 cols at baseline -->
  <g fill="#ffd534">
    <rect x="162" y="122" width="12" height="12"/>
    <rect x="174" y="122" width="12" height="12"/>
    <rect x="186" y="122" width="12" height="12"/>
    <rect x="198" y="122" width="12" height="12"/>
    <rect x="210" y="122" width="12" height="12"/>
  </g>

  <!--
    F lettermark — pixel font, block=22px, centered
    5-col × 7-row classic pixel F:
      row 0: full top bar (5)
      row 3: mid bar (4)
      rows 1,2,4,5,6: left stroke only (col 0)
    x-origin=201 (centers 5×22=110px at x=256), y-origin=190
    cols: 201 223 245 267 289   rows: 190 212 234 256 278 300 322
  -->
  <g fill="#e4e4e4">
    <!-- row 0: top bar -->
    <rect x="201" y="190" width="22" height="22"/>
    <rect x="223" y="190" width="22" height="22"/>
    <rect x="245" y="190" width="22" height="22"/>
    <rect x="267" y="190" width="22" height="22"/>
    <rect x="289" y="190" width="22" height="22"/>
    <!-- row 1 -->
    <rect x="201" y="212" width="22" height="22"/>
    <!-- row 2 -->
    <rect x="201" y="234" width="22" height="22"/>
    <!-- row 3: mid bar -->
    <rect x="201" y="256" width="22" height="22"/>
    <rect x="223" y="256" width="22" height="22"/>
    <rect x="245" y="256" width="22" height="22"/>
    <rect x="267" y="256" width="22" height="22"/>
    <!-- row 4 -->
    <rect x="201" y="278" width="22" height="22"/>
    <!-- row 5 -->
    <rect x="201" y="300" width="22" height="22"/>
    <!-- row 6 -->
    <rect x="201" y="322" width="22" height="22"/>
  </g>
</svg>
