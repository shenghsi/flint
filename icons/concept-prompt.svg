<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Subtle amber glow behind the cursor -->
    <radialGradient id="cursorGlow" cx="365" cy="400" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffd534" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd534" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="#0e0e0e"/>

  <!-- > chevron — bold, geometric, white -->
  <polyline points="86,112 280,256 86,400"
            fill="none"
            stroke="#e4e4e4"
            stroke-width="52"
            stroke-linecap="round"
            stroke-linejoin="round"/>

  <!-- cursor glow -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#cursorGlow)"/>

  <!-- _ cursor — amber, same weight as the chevron strokes -->
  <line x1="302" y1="400" x2="432" y2="400"
        stroke="#ffd534"
        stroke-width="48"
        stroke-linecap="round"/>
</svg>
