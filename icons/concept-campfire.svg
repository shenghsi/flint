<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Ember glow pooling at the base -->
    <radialGradient id="emberGlow" cx="256" cy="390" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ff5500" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
    </radialGradient>

    <!-- Flame outer → inner gradient (orange core to brighter center) -->
    <radialGradient id="flameOuter" cx="256" cy="310" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffb220"/>
      <stop offset="60%"  stop-color="#ff7018"/>
      <stop offset="100%" stop-color="#cc4008"/>
    </radialGradient>
    <radialGradient id="flameInner" cx="256" cy="310" r="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffe060"/>
      <stop offset="55%"  stop-color="#ffb020"/>
      <stop offset="100%" stop-color="#ff8020"/>
    </radialGradient>
    <radialGradient id="flameCore" cx="256" cy="320" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#fff9c0"/>
      <stop offset="50%"  stop-color="#ffe860"/>
      <stop offset="100%" stop-color="#ffcc30"/>
    </radialGradient>
  </defs>

  <!-- Background: very dark warm charcoal -->
  <rect width="512" height="512" rx="115" fill="#0c0906"/>

  <!-- Ember glow overlay on background -->
  <rect width="512" height="512" rx="115" fill="url(#emberGlow)"/>

  <!-- Flame outer (orange) — drawn behind the logs -->
  <path d="M 256 92
           C 306 122, 388 218, 372 328
           C 360 396, 312 434, 256 436
           C 200 434, 152 396, 140 328
           C 124 218, 206 122, 256 92 Z"
        fill="url(#flameOuter)"/>

  <!-- Flame inner (amber) -->
  <path d="M 256 148
           C 296 173, 350 252, 336 332
           C 326 386, 296 416, 256 418
           C 216 416, 186 386, 176 332
           C 162 252, 216 173, 256 148 Z"
        fill="url(#flameInner)"/>

  <!-- Flame core (bright yellow-white) -->
  <path d="M 256 205
           C 280 224, 312 276, 300 332
           C 293 365, 278 390, 256 392
           C 234 390, 219 365, 212 332
           C 200 276, 232 224, 256 205 Z"
        fill="url(#flameCore)"/>

  <!-- Logs — A-frame, drawn on top of flame base -->
  <!-- Left log: lower-left up to center crossing -->
  <line x1="144" y1="452" x2="296" y2="316"
        stroke="#2a1808" stroke-width="40" stroke-linecap="round"/>
  <!-- Right log: lower-right up to center crossing -->
  <line x1="368" y1="452" x2="216" y2="316"
        stroke="#341e0a" stroke-width="40" stroke-linecap="round"/>
  <!-- Log grain hints -->
  <line x1="144" y1="452" x2="296" y2="316"
        stroke="#4a2e12" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="368" y1="452" x2="216" y2="316"
        stroke="#4a2e12" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
</svg>
