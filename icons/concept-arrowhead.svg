<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Light from upper-left: highlight top, shadow bottom-right -->
    <linearGradient id="arrowGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%"   stop-color="#cdd1d9"/>
      <stop offset="45%"  stop-color="#979da8"/>
      <stop offset="100%" stop-color="#50555e"/>
    </linearGradient>

    <!-- Soft tip glow -->
    <radialGradient id="tipGlow" cx="256" cy="55" r="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffd534" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd534" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="#0e0e0e"/>

  <!-- Flint arrowhead / projectile point
       Symmetric about x=256. Features:
       - Wide shoulders (~y=195)
       - Notched at ~y=295 (for hafting)
       - Ears flare slightly at base (~y=415)
       - Concave base indent (256, 385)
  -->
  <path d="M 256 58
           L 346 195  L 322 295  L 358 415
           L 292 372  L 256 388
           L 220 372  L 154 415
           L 190 295  L 166 195
           Z"
        fill="url(#arrowGrad)"
        stroke="#ced2da" stroke-width="2" stroke-linejoin="round"/>

  <!-- Center ridge — suggests a knapped flint face -->
  <line x1="256" y1="58" x2="256" y2="388"
        stroke="#ffffff" stroke-width="1.5" opacity="0.14"/>

  <!-- Cross-flake detail lines -->
  <line x1="256" y1="110" x2="185" y2="230"
        stroke="#ffffff" stroke-width="1" opacity="0.08"/>
  <line x1="256" y1="110" x2="327" y2="230"
        stroke="#ffffff" stroke-width="1" opacity="0.08"/>

  <!-- Tip glow -->
  <circle cx="256" cy="55" r="32" fill="url(#tipGlow)"/>

  <!-- Spark star at tip (outer r=16, inner r=5) -->
  <path d="M 256 39 L 259.54 51.46 L 272 55 L 259.54 58.54 L 256 71 L 252.46 58.54 L 240 55 L 252.46 51.46 Z"
        fill="#ffd534"/>
</svg>
