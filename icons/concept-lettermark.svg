<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- macOS-style rounded square background -->
  <rect width="512" height="512" rx="115" fill="#0e0e0e"/>

  <!--
    Geometric F lettermark.
    The F is built from three rectangles:
      • Left vertical stroke (full height)
      • Top horizontal bar (full width)
      • Middle horizontal bar (shorter)
    Sized so the glyph is centered and fills ~70% of the icon.
  -->
  <g fill="#e4e4e4">
    <!-- Vertical stroke: x=118, width=72, y=100 → 412 (height=312) -->
    <rect x="118" y="100" width="72" height="312" rx="6"/>
    <!-- Top horizontal bar: x=118 → 394 (width=276), y=100, height=80 -->
    <rect x="118" y="100" width="276" height="80" rx="6"/>
    <!-- Middle horizontal bar: x=118 → 310 (width=192), y=230, height=66 -->
    <rect x="118" y="230" width="192" height="66" rx="6"/>
  </g>
</svg>
