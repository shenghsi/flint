<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="cursorGlow" cx="148" cy="124" r="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffd534" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffd534" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="#0e0e0e"/>

  <!-- ─── Small >_ prompt — top-left ─────────────────────────── -->
  <polyline points="54,58 104,90 54,122"
            fill="none"
            stroke="#e4e4e4"
            stroke-width="18"
            stroke-linecap="round"
            stroke-linejoin="round"/>

  <!-- cursor glow -->
  <rect width="512" height="512" rx="115" fill="url(#cursorGlow)"/>

  <!-- _ cursor -->
  <line x1="116" y1="122" x2="162" y2="122"
        stroke="#ffd534"
        stroke-width="16"
        stroke-linecap="round"/>

  <!-- ─── Large F lettermark ──────────────────────────────────── -->
  <g fill="#e4e4e4">
    <!-- Vertical stroke -->
    <rect x="148" y="152" width="68" height="264" rx="7"/>
    <!-- Top horizontal bar -->
    <rect x="148" y="152" width="234" height="68" rx="7"/>
    <!-- Middle horizontal bar (shorter) -->
    <rect x="148" y="286" width="166" height="60" rx="7"/>
  </g>
</svg>
