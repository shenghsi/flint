# Ported from herdrdev/herdr (https://github.com/herdrdev/herdr,
# src/detect/manifests/codex.toml). See claude.toml in this directory for
# what "trimmed" means and why.
#
# `trust_directory` (herdr's one-time "do you trust this directory?" prompt
# rule) is dropped: it keys off `top_non_empty_lines(20)`, which needs the
# true top of the scrollback. Flint's classifier only has a bounded recent
# tail (see SCREEN_TAIL_LINE_COUNT in attention_detection.rs), so that
# region can't be reproduced honestly here.

[[rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1100
region = "osc_title"
contains = ["Action Required"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1050
region = "osc_title"
regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)']

[[rules]]
id = "screen_working_fallback"
state = "working"
priority = 500
region = "bottom_non_empty_lines(3)"
line_regex = ['^[•◦]\s+Working \([^)]*esc to interrupt\)(?: · .*)?$']
not = [{ contains = ["■ Conversation interrupted"] }]

[[rules]]
id = "live_strong_blocker"
state = "blocked"
priority = 900
region = "after_last_prompt_marker"
any = [
  { contains = ["press enter to confirm or esc to cancel"] },
  { contains = ["enter to submit answer"] },
  { contains = ["enter to submit all"] },
  { contains = ["allow command?"] },
]

[[rules]]
id = "weak_blocker"
state = "blocked"
priority = 600
region = "whole_recent"
any = [
  { contains = ["[y/n]"] },
  { contains = ["yes (y)"] },
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
]

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 100
region = "osc_title"
regex = ['\S']
not = [
  { regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)'] },
  { contains = ["Action Required"] },
]
