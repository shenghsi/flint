# Ported from herdrdev/herdr (https://github.com/herdrdev/herdr,
# src/detect/manifests/opencode.toml). See claude.toml in this directory for
# what "trimmed" means and why. Herdr's own opencode.toml has no `idle`
# rule (only `blocked` and `working`), so Flint can't classify an OpenCode
# thread as "finished" via screen content -- store.rs's caller decides what
# that means for the triggering event.

[[rules]]
id = "permission_required"
state = "blocked"
priority = 300
region = "whole_recent"
any = [
  { contains = ["△ Permission required"] },
  { contains = ["esc dismiss"], any = [{ contains = ["enter confirm"] }, { contains = ["enter submit"] }, { contains = ["enter toggle"] }], all = [{ any = [{ contains = ["↑↓ select"] }, { contains = ["⇆ tab"] }] }] },
]

[[rules]]
id = "interrupt_hint_working"
state = "working"
priority = 110
region = "whole_recent"
any = [
  { contains = ["esc to interrupt"] },
  { contains = ["ctrl+c to interrupt"] },
  { contains = ["press esc to interrupt"] },
  { line_regex = ['(?i).*opencode.*esc (again to )?interrupt'] },
]

[[rules]]
id = "progress_bar_working"
state = "working"
priority = 100
region = "whole_recent"
regex = ['(■|⬝){4,}']
