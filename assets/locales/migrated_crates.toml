# Add a crate only after all its user-facing string literals use localization
# messages or have an explicit allowlist entry.
crates = [
  "agent_threads",
  "auto_update_ui",
  "command_palette",
  "csv_preview",
  "debugger_ui",
  "dev_container",
  "diagnostics",
  "encoding_selector",
  "extensions_ui",
  "file_finder",
  "go_to_line",
  "git_ui",
  "image_viewer",
  "install_cli",
  "keymap_editor",
  "language_selector",
  "line_ending_selector",
  "markdown_preview",
  "open_path_prompt",
  "outline_panel",
  "project_panel",
  "project_symbols",
  "recent_projects",
  "repl",
  "search",
  "snippets_ui",
  "svg_preview",
  "tab_switcher",
  "tasks_ui",
  "terminal_view",
  "theme_selector",
]

# Each entry permits one technical string that a UI literal sink uses. Add a
# narrow entry only when the text is not visible to a user.
[[allowlist]]
file = "crates/diagnostics/src/items.rs"
text = "diagnostic-indicator"
reason = "Element identifier"

