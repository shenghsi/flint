name: release
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
on:
  push:
    tags:
      - v*
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -euo pipefail {0}
jobs:
  run_tests_mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Setup cargo config
        run: |
          mkdir -p ./../.cargo
          cp ./.cargo/ci-config.toml ./../.cargo/config.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup sccache
        run: ./script/setup-sccache
        env:
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          SCCACHE_GHA_ENABLED: "on"
      - run: cargo install cargo-nextest --locked
      - run: cargo nextest run --workspace --no-fail-fast --no-tests=warn
      - run: sccache --show-stats || true
      - name: Cleanup cargo config
        if: always()
        run: rm -rf ./../.cargo
    timeout-minutes: 90

  run_tests_linux:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 500ms --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup cargo config
        run: |
          mkdir -p ./../.cargo
          cp ./.cargo/ci-config.toml ./../.cargo/config.toml
      - run: ./script/linux
      - run: ./script/download-wasi-sdk
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup sccache
        run: ./script/setup-sccache
        env:
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          SCCACHE_GHA_ENABLED: "on"
      - run: cargo install cargo-nextest --locked
      - run: cargo nextest run --workspace --no-fail-fast --no-tests=warn
      - run: sccache --show-stats || true
      - name: Cleanup cargo config
        if: always()
        run: rm -rf ./../.cargo
    timeout-minutes: 90

  run_tests_windows:
    runs-on: windows-2022
    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Setup cargo config
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "./../.cargo" -Force
          Copy-Item -Path "./.cargo/ci-config.toml" -Destination "./../.cargo/config.toml"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup sccache
        shell: pwsh
        run: ./script/setup-sccache.ps1
        env:
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          SCCACHE_GHA_ENABLED: "on"
      - shell: pwsh
        run: cargo install cargo-nextest --locked
      - shell: pwsh
        run: cargo nextest run --workspace --no-fail-fast --no-tests=warn
      - name: Show sccache stats
        shell: pwsh
        run: if ($env:RUSTC_WRAPPER) { & $env:RUSTC_WRAPPER --show-stats }; exit 0
      - name: Cleanup cargo config
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Path "./../.cargo" -Force -ErrorAction SilentlyContinue
    timeout-minutes: 90

  clippy_mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Setup cargo config
        run: |
          mkdir -p ./../.cargo
          cp ./.cargo/ci-config.toml ./../.cargo/config.toml
      - name: Setup sccache
        run: ./script/setup-sccache
        env:
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          SCCACHE_GHA_ENABLED: "on"
      - run: ./script/clippy
      - run: sccache --show-stats || true
    timeout-minutes: 90

  clippy_linux:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Setup cargo config
        run: |
          mkdir -p ./../.cargo
          cp ./.cargo/ci-config.toml ./../.cargo/config.toml
      - run: ./script/linux
      - run: ./script/download-wasi-sdk
      - name: Setup sccache
        run: ./script/setup-sccache
        env:
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          SCCACHE_GHA_ENABLED: "on"
      - run: ./script/clippy
      - run: sccache --show-stats || true
    timeout-minutes: 90

  clippy_windows:
    runs-on: windows-2022
    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Setup cargo config
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "./../.cargo" -Force
          Copy-Item -Path "./.cargo/ci-config.toml" -Destination "./../.cargo/config.toml"
      - name: Setup sccache
        shell: pwsh
        run: ./script/setup-sccache.ps1
        env:
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          SCCACHE_GHA_ENABLED: "on"
      - shell: pwsh
        run: ./script/clippy.ps1
      - name: Show sccache stats
        shell: pwsh
        run: if ($env:RUSTC_WRAPPER) { & $env:RUSTC_WRAPPER --show-stats }; exit 0
    timeout-minutes: 90

  create_draft_release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 25
          ref: ${{ github.ref }}
      - run: script/determine-release-channel
      - run: mkdir -p target/
      - name: Generate release notes
        run: |
          node --redirect-warnings=/dev/null ./script/draft-release-notes "$RELEASE_VERSION" "$RELEASE_CHANNEL" > target/release-notes.md || true
          if [ ! -s target/release-notes.md ]; then
            echo "Release notes for $RELEASE_VERSION ($RELEASE_CHANNEL)" > target/release-notes.md
          fi
      - name: Create draft release
        run: script/create-draft-release target/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10

  bundle_mac_aarch64:
    needs:
      - run_tests_mac
      - clippy_mac
    runs-on: macos-15
    env:
      CARGO_INCREMENTAL: 0
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup sccache
        run: ./script/setup-sccache
        env:
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          SCCACHE_GHA_ENABLED: "on"
      - run: ./script/bundle-mac aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: Flint-aarch64.dmg
          path: target/aarch64-apple-darwin/release/Flint-aarch64.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: flint-remote-server-macos-aarch64.gz
          path: target/flint-remote-server-macos-aarch64.gz
          if-no-files-found: error
    timeout-minutes: 90

  bundle_mac_x86_64:
    needs:
      - run_tests_mac
      - clippy_mac
    runs-on: macos-13
    env:
      CARGO_INCREMENTAL: 0
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup sccache
        run: ./script/setup-sccache
        env:
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          SCCACHE_GHA_ENABLED: "on"
      - run: ./script/bundle-mac x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: Flint-x86_64.dmg
          path: target/x86_64-apple-darwin/release/Flint-x86_64.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: flint-remote-server-macos-x86_64.gz
          path: target/flint-remote-server-macos-x86_64.gz
          if-no-files-found: error
    timeout-minutes: 90

  bundle_linux_aarch64:
    needs:
      - run_tests_linux
      - clippy_linux
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_INCREMENTAL: 0
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: ./script/linux
      - run: ./script/download-wasi-sdk
      - name: Setup sccache
        run: ./script/setup-sccache
        env:
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          SCCACHE_GHA_ENABLED: "on"
      - run: ./script/bundle-linux
      - uses: actions/upload-artifact@v4
        with:
          name: flint-linux-aarch64.tar.gz
          path: target/release/flint-linux-aarch64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: flint-remote-server-linux-aarch64.gz
          path: target/flint-remote-server-linux-aarch64.gz
          if-no-files-found: error
    timeout-minutes: 90

  bundle_linux_x86_64:
    needs:
      - run_tests_linux
      - clippy_linux
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
      CC: clang
      CXX: clang++
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: ./script/linux
      - run: ./script/download-wasi-sdk
      - name: Setup sccache
        run: ./script/setup-sccache
        env:
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          SCCACHE_GHA_ENABLED: "on"
      - run: ./script/bundle-linux
      - uses: actions/upload-artifact@v4
        with:
          name: flint-linux-x86_64.tar.gz
          path: target/release/flint-linux-x86_64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: flint-remote-server-linux-x86_64.gz
          path: target/flint-remote-server-linux-x86_64.gz
          if-no-files-found: error
    timeout-minutes: 90

  bundle_windows_x86_64:
    needs:
      - run_tests_windows
      - clippy_windows
    runs-on: windows-2022
    env:
      CARGO_INCREMENTAL: 0
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
      ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
      CERT_PROFILE_NAME: ${{ vars.AZURE_SIGNING_CERT_PROFILE_NAME }}
      ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      FILE_DIGEST: SHA256
      TIMESTAMP_DIGEST: SHA256
      TIMESTAMP_SERVER: http://timestamp.acs.microsoft.com
    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Setup sccache
        shell: pwsh
        run: ./script/setup-sccache.ps1
        env:
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          SCCACHE_GHA_ENABLED: "on"
      - shell: pwsh
        run: script/bundle-windows.ps1 -Architecture x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: Flint-x86_64.exe
          path: target/Flint-x86_64.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: flint-remote-server-windows-x86_64.zip
          path: target/flint-remote-server-windows-x86_64.zip
          if-no-files-found: error
    timeout-minutes: 90

  bundle_windows_aarch64:
    needs:
      - run_tests_windows
      - clippy_windows
    runs-on: windows-11-arm
    env:
      CARGO_INCREMENTAL: 0
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
      ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
      CERT_PROFILE_NAME: ${{ vars.AZURE_SIGNING_CERT_PROFILE_NAME }}
      ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      FILE_DIGEST: SHA256
      TIMESTAMP_DIGEST: SHA256
      TIMESTAMP_SERVER: http://timestamp.acs.microsoft.com
    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Setup sccache
        shell: pwsh
        run: ./script/setup-sccache.ps1
        env:
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          SCCACHE_GHA_ENABLED: "on"
      - shell: pwsh
        run: script/bundle-windows.ps1 -Architecture aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: Flint-aarch64.exe
          path: target/Flint-aarch64.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: flint-remote-server-windows-aarch64.zip
          path: target/flint-remote-server-windows-aarch64.zip
          if-no-files-found: error
    timeout-minutes: 90

  upload_release_assets:
    needs:
      - create_draft_release
      - bundle_linux_aarch64
      - bundle_linux_x86_64
      - bundle_mac_aarch64
      - bundle_mac_x86_64
      - bundle_windows_aarch64
      - bundle_windows_x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts/
      - name: List artifacts
        run: ls -lR ./artifacts
      - name: Prepare release artifacts
        run: |
          mkdir -p release-artifacts/
          mv ./artifacts/Flint-aarch64.dmg/Flint-aarch64.dmg release-artifacts/Flint-aarch64.dmg
          mv ./artifacts/Flint-x86_64.dmg/Flint-x86_64.dmg release-artifacts/Flint-x86_64.dmg
          mv ./artifacts/flint-linux-aarch64.tar.gz/flint-linux-aarch64.tar.gz release-artifacts/flint-linux-aarch64.tar.gz
          mv ./artifacts/flint-linux-x86_64.tar.gz/flint-linux-x86_64.tar.gz release-artifacts/flint-linux-x86_64.tar.gz
          mv ./artifacts/Flint-x86_64.exe/Flint-x86_64.exe release-artifacts/Flint-x86_64.exe
          mv ./artifacts/Flint-aarch64.exe/Flint-aarch64.exe release-artifacts/Flint-aarch64.exe
          mv ./artifacts/flint-remote-server-macos-aarch64.gz/flint-remote-server-macos-aarch64.gz release-artifacts/flint-remote-server-macos-aarch64.gz
          mv ./artifacts/flint-remote-server-macos-x86_64.gz/flint-remote-server-macos-x86_64.gz release-artifacts/flint-remote-server-macos-x86_64.gz
          mv ./artifacts/flint-remote-server-linux-aarch64.gz/flint-remote-server-linux-aarch64.gz release-artifacts/flint-remote-server-linux-aarch64.gz
          mv ./artifacts/flint-remote-server-linux-x86_64.gz/flint-remote-server-linux-x86_64.gz release-artifacts/flint-remote-server-linux-x86_64.gz
          mv ./artifacts/flint-remote-server-windows-aarch64.zip/flint-remote-server-windows-aarch64.zip release-artifacts/flint-remote-server-windows-aarch64.zip
          mv ./artifacts/flint-remote-server-windows-x86_64.zip/flint-remote-server-windows-x86_64.zip release-artifacts/flint-remote-server-windows-x86_64.zip
      - name: Upload to GitHub Release
        run: gh release upload "$GITHUB_REF_NAME" release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate_release_assets:
    needs:
      - upload_release_assets
    runs-on: ubuntu-24.04
    steps:
      - name: Validate all expected assets are present
        run: |
          EXPECTED_ASSETS='["Flint-aarch64.dmg", "Flint-x86_64.dmg", "flint-linux-aarch64.tar.gz", "flint-linux-x86_64.tar.gz", "Flint-x86_64.exe", "Flint-aarch64.exe", "flint-remote-server-macos-aarch64.gz", "flint-remote-server-macos-x86_64.gz", "flint-remote-server-linux-aarch64.gz", "flint-remote-server-linux-x86_64.gz", "flint-remote-server-windows-aarch64.zip", "flint-remote-server-windows-x86_64.zip"]'
          TAG="$GITHUB_REF_NAME"
          ACTUAL_ASSETS=$(gh release view "$TAG" --json assets -q '[.assets[].name]')
          MISSING_ASSETS=$(echo "$EXPECTED_ASSETS" | jq -r --argjson actual "$ACTUAL_ASSETS" '. - $actual | .[]')
          if [ -n "$MISSING_ASSETS" ]; then
            echo "Error: The following assets are missing from the release:"
            echo "$MISSING_ASSETS"
            exit 1
          fi
          echo "All expected assets are present in the release."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auto_release_preview:
    needs:
      - validate_release_assets
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-pre')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Auto-release preview
        run: |
          tag="$GITHUB_REF_NAME"
          gh release edit "$tag" --draft=false --prerelease
          echo "Preview release $tag published"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
