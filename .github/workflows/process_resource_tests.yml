name: Process resource tests

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/terminal/**
      - crates/util/**
      - .github/workflows/process_resource_tests.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: ./script/linux
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run -p util -p terminal --no-fail-fast
      - run: cargo clippy -p util -p terminal --all-targets --all-features -- --deny warnings
