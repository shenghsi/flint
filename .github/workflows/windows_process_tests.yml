name: Windows process tests

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/terminal/**
      - crates/util/**
      - .github/workflows/windows_process_tests.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run -p util -p terminal --no-fail-fast
      - run: cargo clippy -p util -p terminal --all-targets --all-features -- --deny warnings
