name: Setup sccache
description: Install sccache and configure the GitHub Actions cache backend

# The GitHub Actions cache service credentials (ACTIONS_RESULTS_URL and
# ACTIONS_RUNTIME_TOKEN) are only injected into the environment of JavaScript
# actions, never `run:` steps, and they are not exposed through the `env`
# context. Re-export them through GITHUB_ENV here so that the setup script can
# detect the cache backend and sccache can reach it during the build.
runs:
  using: composite
  steps:
    - name: Expose GitHub Actions cache credentials
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Configure sccache
      if: runner.os != 'Windows'
      shell: bash
      run: ./script/setup-sccache
      env:
        SCCACHE_GHA_ENABLED: "on"
    - name: Configure sccache
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./script/setup-sccache.ps1
      env:
        SCCACHE_GHA_ENABLED: "on"
