name: Report a crash
description: Flint is crashing or freezing or hanging.
type: Crash
labels: "state:needs triage"
body:
  - type: textarea
    attributes:
      label: Reproduction steps
      description: A step-by-step description of how to reproduce the crash from a **clean Flint install**. The more context you provide, the easier it is to find and fix the problem fast.
      placeholder: |
        1. Start Flint
        2. Perform an action
        3. Flint crashes
    validations:
      required: true
  - type: textarea
    attributes:
      label: Flint version and system specs
      description: |
        Open the command palette in Flint, then type “flint: copy system specs into clipboard”.
      placeholder: |
        Flint: v0.215.0 (Flint Nightly bfe141ea79aa4984028934067ba75c48d99136ae)
        OS: macOS 15.1
        Memory: 36 GiB
        Architecture: aarch64
    validations:
      required: true
  - type: textarea
    attributes:
      label: Attach Flint log file
      description: |
        Open the command palette in Flint, then type `flint: open log` to see the last 1000 lines. Or type `flint: reveal log in file manager` in the command palette to reveal the log file itself.

        ⚠️ **Please review your log file for secrets (API keys, tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>Flint.log</summary>

        <!-- Paste your log inside the code block. -->
        ```log

        ```

        </details>
    validations:
      required: false
